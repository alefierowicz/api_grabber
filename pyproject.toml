[project]
name = "api-grabber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marcel-alefierowicz", email = "mrclalefierowicz@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-html>=4.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "config: config loading and validation",
    "fetcher: http fetching with a mocked session",
    "processor: normalization and aggregation",
]
